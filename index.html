<title>CPA 会计 · 智能题库（全章版）</title>
<style>
:root{--brand:#0f766e;--brand2:#115e59;--bg:#f4f6f7;--card:#fff;--line:#e3e8e8;--txt:#1c2b2a;--sub:#6b7c7a;--red:#dc2626;--green:#16a34a;--amber:#d97706;--shadow:0 2px 10px rgba(16,60,55,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 96px}
header{padding:8px 2px 14px}
header .t{font-size:22px;font-weight:700;letter-spacing:.3px}
header .s{font-size:13px;color:var(--sub);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700}
.muted{color:var(--sub);font-size:13px}
.big{font-size:28px;font-weight:800;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;font-size:15px;font-weight:600;color:var(--txt);cursor:pointer;min-height:56px}
.btn:active{transform:scale(.985)}
.btn .b1{display:block}
.btn .b2{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;text-align:center}
.btn.primary .b2{color:rgba(255,255,255,.8)}
.btn.ghost{background:transparent;text-align:center;color:var(--sub);min-height:46px;font-weight:500}
.btn.danger{color:var(--red);text-align:center;min-height:46px}
.btn.small{display:inline-block;width:auto;min-height:36px;padding:6px 12px;font-size:13px;border-radius:9px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#e8f2f1;color:var(--brand);margin-right:6px}
.pill.red{background:#fee2e2;color:var(--red)}.pill.green{background:#dcfce7;color:var(--green)}.pill.amber{background:#fef3c7;color:var(--amber)}
.bar{height:7px;background:#e9eeee;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
#qmeta{font-size:13px;color:var(--sub)}
#qprog{font-size:13px;color:var(--sub);font-weight:600}
#qstem{font-size:18px;font-weight:600;margin:14px 0 16px;line-height:1.7}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:16px;cursor:pointer;min-height:52px;color:var(--txt)}
.opt .k{display:inline-block;width:26px;font-weight:700;color:var(--brand)}
.opt.sel{border-color:var(--brand);background:#f0faf8}
.opt.ok{border-color:var(--green);background:#f0fdf4}
.opt.bad{border-color:var(--red);background:#fef2f2}
.opt:disabled{cursor:default}
.fb{border-radius:13px;padding:14px;margin-top:14px;font-size:15px;line-height:1.7}
.fb.good{background:#f0fdf4;border:1px solid #bbf7d0}
.fb.wrong{background:#fef2f2;border:1px solid #fecaca}
.fb b{display:block;margin-bottom:6px;font-size:16px}
.fb .lbl{font-weight:700;color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.item .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .nm{font-weight:700;font-size:15px}
.item .st{font-size:13px;color:var(--sub);margin-top:4px}
.wk{height:8px;background:#eef1f1;border-radius:99px;margin-top:8px;overflow:hidden}
.wk>i{display:block;height:100%;border-radius:99px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:12px;color:var(--sub);cursor:pointer}
.tabbar button.on{color:var(--brand);font-weight:700}
.tabbar .ic{display:block;font-size:20px;line-height:1.3}
.tip{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.tip button{float:right;border:0;background:none;color:#92400e;font-size:13px;cursor:pointer}
.statline{display:flex;justify-content:space-between;gap:10px;text-align:center}
.statline div{flex:1}
.statline .n{font-size:22px;font-weight:800}
.statline .l{font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1c2b2a;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.switch{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
.switch input{width:44px;height:26px;accent-color:var(--brand)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.qtag{font-size:12px;color:var(--sub);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="t">📘 CPA 会计 · 智能题库（全章版）</div><div class="s">概念点客观题库 · 全书累计 2422 题 · 已入库 12 章</div></header>
  <div id="tip" class="tip"><button onclick="closeTip()">知道了</button>在 Safari 里点「分享 → 添加到主屏幕」，就能像小 App 一样全屏刷；进度只存在这台设备的浏览器里，按题号记，新增章节不会覆盖旧进度。</div>

    <div class="card">
      <div class="row" style="justify-content:space-between"><span id="qmeta"></span><span id="qprog"></span></div>
      <div class="bar"><i id="barfill" style="width:0"></i></div>
      <div id="qstem"></div>
      <div id="opts"></div>
      <button id="btnSubmit" class="btn primary" onclick="submit()"><span class="b1">提交答案</span></button>
      <div id="fbbox"></div>
      <button id="btnNext" class="btn primary" style="display:none;margin-top:12px" onclick="next()"><span class="b1">下一题 →</span></button>
      <button class="btn ghost" style="margin-top:10px" onclick="endRound()">结束本轮</button>
    </div>
  </div>
  <div id="v-stats" style="display:none"></div>
  <div id="v-wrong" style="display:none"></div>
  <div id="v-result" style="display:none"></div>
</div>

</nav>

// 题库升级为全书版：旧题号 q01..q133 -> 7-001..7-133，旧进度无缝迁移
function migrate(o){
 let s=Object.assign({},DEF,o,{stats:o.stats||{},wrong:(o.wrong||[]).slice()});
 let changed=false;
 const st={};
 Object.keys(s.stats).forEach(k=>{
  const m=/^q(\d+)$/.exec(k);
  const nk=m?('7-'+String(+m[1]).padStart(3,'0')):k;
  if(nk!==k)changed=true;
  if(!(nk in st))st[nk]=s.stats[k];
 });
 s.stats=st;
 s.wrong=s.wrong.map(x=>{const m=/^q(\d+)$/.exec(x);
  if(m){changed=true;return '7-'+String(+m[1]).padStart(3,'0')}return x});
 s.wrong=[...new Set(s.wrong)].filter(x=>Q.some(q=>q.id===x));
 if(changed){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
 return s;
}

  if(!raw){for(const k of OLD_KEYS){const o=localStorage.getItem(k);if(o){raw=o;try{localStorage.setItem(KEY,o)}catch(e){}break}}}
  return migrate(JSON.parse(raw||'{}'))
 }catch(e){return JSON.parse(JSON.stringify(DEF))}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('当前环境无法保存进度，可用「导出进度」备份')}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),1900)}
const $=s=>document.querySelector(s);
function show(v){['home','quiz','stats','wrong','result'].forEach(x=>{const e=$('#v-'+x);if(e)e.style.display=x===v?'block':'none'});window.scrollTo(0,0)}
function go(v){round=null;show(v);if(v==='home')renderHome();if(v==='stats')renderStats();if(v==='wrong')renderWrong();setTab(v)}
function setTab(v){document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));const b=$('#tab-'+v);if(b)b.classList.add('on')}
function closeTip(){S.tip=0;save();$('#tip').style.display='none'}
if(!S.tip)$('#tip').style.display='none';

function stat(q){return S.stats[q.id]||{r:0,w:0,last:'',ever:false}}
function done(q){const s=stat(q);return s.r+s.w}
function rate(q){const s=stat(q),d=s.r+s.w;return d?s.r/d:null}
function mastered(q){const s=stat(q),d=s.r+s.w;return d>0&&s.last==='right'&&s.r/d>=.8}
function unmastered(q){return !mastered(q)}
function totalR(){let r=0,w=0;Q.forEach(q=>{r+=stat(q).r;w+=stat(q).w});return{r,w}}
function weakPoints(){const m={};Q.forEach(q=>{const p=m[q.pkey]||(m[q.pkey]={key:q.pkey,name:q.point,chap:q.chapter,r:0,w:0,done:0});const s=stat(q);p.r+=s.r;p.w+=s.w;p.done+=s.r+s.w});return Object.values(m).map(p=>({...p,rate:p.done?p.r/p.done:null}))}
function weakSections(){const m={};Q.forEach(q=>{const p=m[q.sec]||(m[q.sec]={name:q.sec,r:0,w:0,done:0});const s=stat(q);p.r+=s.r;p.w+=s.w;p.done+=s.r+s.w});return Object.values(m).map(p=>({...p,rate:p.done?p.r/p.done:null}))}
function weakChapters(){const m={};Q.forEach(q=>{const p=m[q.chapter]||(m[q.chapter]={name:q.chapter,r:0,w:0,done:0});const s=stat(q);p.r+=s.r;p.w+=s.w;p.done+=s.r+s.w});return Object.values(m).map(p=>({...p,rate:p.done?p.r/p.done:null}))}
function color(r){return r===null?'#cbd5d1':r<.6?'#dc2626':r<.85?'#d97706':'#16a34a'}
function tag(r){return r===null?'<span class="pill">未练</span>':r<.6?'<span class="pill red">薄弱</span>':r<.85?'<span class="pill amber">待巩固</span>':'<span class="pill green">已掌握</span>'}

function renderHome(){
 const t=totalR(),d=t.r+t.w,r=t.r+d?Math.round(t.r/d*100):0;
 const practiced=Q.filter(q=>done(q)>0).length;
 let h=`<div class="card"><div class="statline">
   <div><div class="n">2422</div><div class="l">题库总量</div></div>
   <div><div class="n">${practiced}</div><div class="l">已练题数</div></div>
   <div><div class="n">${r}%</div><div class="l">累计正确率</div></div>
   <div><div class="n">${S.wrong.length}</div><div class="l">当前错题</div></div>
 </div><div class="bar"><i style="width:${practiced/2422*100}%"></i></div>
 <div class="muted">已完成 ${S.sessions} 轮（每轮至少作答 1 题才算）· 绿=已掌握 / 黄=待巩固 / 红=薄弱</div>
 <div class="muted">题型构成：单选 ${Q.filter(q=>q.type==='单选').length} · 多选 ${Q.filter(q=>q.type==='多选').length} · 判断 ${Q.filter(q=>q.type==='判断').length}（同一考点多面命题）</div>
 <div class="muted">${CHAPS.map(c=>esc(c)+' '+Q.filter(q=>q.chapter===c).length+' 题').join('　·　')}</div></div>`;
 h+=`<div class="card"><h3>开始刷题</h3><div class="grid">
  <button class="btn" onclick="start('all')"><span class="b1">🎲 全部随机刷</span><span class="b2">${Q.length} 题，每次顺序都不同</span></button>
  <button class="btn" onclick="start('mock')"><span class="b1">📝 模拟小卷</span><span class="b2">随机抽 20 题</span></button>
  <button class="btn" onclick="start('wrong')"><span class="b1">❌ 只刷错题</span><span class="b2">当前 ${S.wrong.length} 题</span></button>
  <button class="btn" onclick="start('unmastered')"><span class="b1">🧗 只刷未掌握</span><span class="b2">当前 ${Q.filter(unmastered).length} 题</span></button>
  <button class="btn" onclick="start('weak')"><span class="b1">🎯 薄弱考点专测</span><span class="b2">正确率最低的考点重测</span></button>
  <button class="btn" onclick="start('variant')"><span class="b1">🧩 同考点多面卷</span><span class="b2">同一考点连考单选+多选+判断</span></button>
 </div></div>`;
 h+=`<div class="card"><h3>按章刷</h3><div class="grid">`;
 CHAPS.forEach(c=>{const arr=Q.filter(q=>q.chapter===c),pd=arr.filter(q=>done(q)>0).length;
  h+=`<button class="btn" onclick="start('chapter','${esc(c)}')"><span class="b1">${esc(c)}</span><span class="b2">${arr.length} 题 · 已练 ${pd} · ${arr.filter(q=>S.wrong.includes(q.id)).length} 错</span></button>`});
 h+=`</div></div>`;
 h+=`<div class="card"><h3>按节刷</h3>`;
 CHAPS.forEach(c=>{
  h+=`<div class="muted" style="margin:10px 0 8px;font-weight:700;color:#0f766e">${esc(c)}</div>`;
  const secs=[...new Set(Q.filter(q=>q.chapter===c).map(q=>q.sec))];
  secs.forEach(sec=>{const n=Q.filter(q=>q.sec===sec&&q.chapter===c).length;
   h+=`<button class="btn" style="margin-bottom:9px" onclick="start('section','${esc(sec)}')"><span class="b1">${esc(sec)}</span><span class="b2">${n} 题</span></button>`});
 });
 h+=`</div>`;
 h+=`<div class="card"><h3>设置与备份</h3>
  <div class="switch"><span>打乱选项顺序（避免背答案）</span><input type="checkbox" id="shuf" ${S.shuffle?'checked':''} onchange="S.shuffle=this.checked;save();toast('已保存')"></div>
  <hr>
  <div class="row"><button class="btn small" onclick="exportP()">⬇️ 导出进度</button><button class="btn small" onclick="$('#fileIn').click()">⬆️ 导入进度</button><button class="btn small" onclick="resetP()">🗑 重置进度</button></div>
  <hr>
  <div class="row"><span class="muted" style="flex:1;min-width:180px">轮数只按「本轮至少提交过 1 题」计，点进去没做题不算。旧版误加的轮数可在这里校准：</span><button class="btn small" onclick="calibrateSessions()">✏️ 校准轮数</button></div>
  <div class="muted" style="margin-top:10px">进度只保存在这台 iPad 的这个浏览器里。换设备或清数据前，先导出一份 JSON；导入即可接着刷。全部离线可用，不联网、不要账号。</div></div>`;
 $('#v-home').innerHTML=h;
}

/* ---------- 组卷与答题 ---------- */
let round=null, disp=[], sel=new Set(), orderedKeys=['A','B','C','D'];
function start(mode,arg){
 let pool=Q.slice(),label='';
 if(mode==='chapter'){pool=Q.filter(q=>q.chapter===arg);label=arg}
 if(mode==='section'){pool=Q.filter(q=>q.sec===arg);label=arg}
 if(mode==='point'){pool=Q.filter(q=>q.pkey===arg);label=pool.length?pool[0].point:arg}
 if(mode==='wrong'){pool=Q.filter(q=>S.wrong.includes(q.id));label='只刷错题'}
 if(mode==='unmastered'){pool=Q.filter(unmastered);label='只刷未掌握'}
 if(mode==='weak'){
   const pts=weakPoints().filter(p=>p.done>0).sort((a,b)=>a.rate-b.rate).slice(0,5).map(p=>p.key);
   if(!pts.length){toast('先刷一轮，才有薄弱考点数据～');return}
   pool=Q.filter(q=>pts.includes(q.pkey));label='薄弱考点专测';
 }
 if(mode==='variant'){
   const byPoint={};Q.forEach(q=>(byPoint[q.pkey]||(byPoint[q.pkey]=[])).push(q));
   const pts=shuffle(Object.keys(byPoint)).slice(0,5);
   let picked=[];
   pts.forEach(p=>{
     const arr=byPoint[p];
     ['单选','多选','判断'].forEach(tp=>{
       const cand=shuffle(arr.filter(q=>q.type===tp));
       if(cand.length)picked.push(cand[0]);
     });
     const rest=shuffle(arr.filter(q=>!picked.includes(q)));
     let need=3-picked.filter(q=>q.pkey===p).length;
     while(need-->0&&rest.length)picked.push(rest.pop());
   });
   pool=picked;label='同考点多面卷';
 }
 if(mode==='mock'){
   const per={'单选':7,'多选':7,'判断':6};let picked=[];
   Object.keys(per).forEach(tp=>{picked=picked.concat(shuffle(Q.filter(q=>q.type===tp)).slice(0,per[tp]))});
   pool=shuffle(picked);label='模拟小卷';
 }
 if(!pool.length){toast('这个范围暂时没有题～');return}
 if(mode!=='mock')pool=shuffle(pool);
 round={list:pool,i:0,right:0,answered:false,mode,arg,label,wrongIds:[],counted:false};
 setTab('home');show('quiz');renderQ();
}
function renderQ(){
 const q=round.list[round.i];
 const opts=q.opts.map((t,i)=>({t,k:orderedKeys[i]}));
 disp=(S.shuffle&&q.type!=='判断')?shuffle(opts):opts;
 sel=new Set();round.answered=false;
 const correct=q.ans.split('').map(c=>q.opts[orderedKeys.indexOf(c)]);
 round.correct=correct;
 $('#qmeta').textContent=`${esc(q.chapter.split(' ')[0])} · ${esc(q.sec)} · ${esc(q.type)} · ${esc(q.point)}`;
 $('#qprog').textContent=`第 ${round.i+1} / ${round.list.length} 题 · 已答 ${round.i}`;
 $('#barfill').style.width=(round.i/round.list.length*100)+'%';
 $('#qstem').innerHTML=esc(q.stem);
 $('#opts').innerHTML=disp.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})"><span class="k">${o.k}</span>${esc(o.t)}</button>`).join('');
 $('#btnSubmit').style.display='block';$('#btnSubmit').disabled=false;
 $('#btnNext').style.display='none';$('#fbbox').innerHTML='';
 $('#opts').querySelectorAll('.opt').forEach(b=>b.disabled=false);
}
function pick(i){if(round.answered)return;const q=round.list[round.i];if(q.type!=='多选')sel.clear();if(sel.has(i))sel.delete(i);else sel.add(i);
 $('#opts').querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',sel.has(j)))}
function submit(){
 if(round.answered)return;
 if(!sel.size){toast('先选一个答案～');return}
 const q=round.list[round.i];
 const chosen=[...sel].map(i=>disp[i].t);
 const ok=chosen.length===round.correct.length&&chosen.every(t=>round.correct.includes(t));
 round.answered=true;
 record(q,ok);
 // 有效轮次：本轮第一次真正提交答案才 +1；只点进组卷、一题未答不计
 if(!round.counted){round.counted=true;S.sessions++;save()}
 if(ok)round.right++;else round.wrongIds.push(q.id);
 // 选项着色
 $('#opts').querySelectorAll('.opt').forEach((b,j)=>{const t=disp[j].t;b.disabled=true;b.classList.remove('sel');
   if(round.correct.includes(t))b.classList.add('ok');else if(sel.has(j))b.classList.add('bad')});
 const ansTxt=q.ans.split('').map(c=>c+'．'+q.opts[orderedKeys.indexOf(c)]).join('　');
 $('#fbbox').innerHTML=`<div class="fb ${ok?'good':'wrong'}"><b>${ok?'✅ 答对了':'❌ 答错了'}</b>
   <div><span class="lbl">正确答案：</span>${esc(ansTxt)}</div>
   <div style="margin-top:6px"><span class="lbl">解析：</span>${esc(q.exp)}</div>
   <div style="margin-top:6px"><span class="lbl">讲义位置：</span>${esc(q.loc)}</div></div>`;
 $('#btnSubmit').style.display='none';
 $('#btnNext').style.display='block';
 $('#btnNext').innerHTML=`<span class="b1">${round.i+1>=round.list.length?'查看本轮结果 →':'下一题 →'}</span>`;
 $('#barfill').style.width=((round.i+1)/round.list.length*100)+'%';
}
function record(q,ok){
 const s=stat(q);
 if(ok){s.r++;s.last='right';S.wrong=S.wrong.filter(id=>id!==q.id)}
 else{s.w++;s.last='wrong';s.ever=true;if(!S.wrong.includes(q.id))S.wrong.push(q.id)}
 S.stats[q.id]=s;save();
}
function next(){round.i++;if(round.i>=round.list.length)showResult();else renderQ()}
function endRound(){if(round&&round.i>0)showResult();else go('home')}
function showResult(){
 const tot=round.i,c=round.right,p=tot?Math.round(c/tot*100):0;
 const pts={};round.wrongIds.forEach(id=>{const q=Q.find(x=>x.id===id);const k=q.chapter.split(' ')[0]+' · '+q.point;pts[k]=(pts[k]||0)+1});
 const plist=Object.entries(pts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="pill red">${esc(k)} ×${v}</span>`).join('');
 let h=`<div class="card" style="text-align:center"><div class="muted">${esc(round.label)} · 本轮结束</div>
  <div class="big" style="margin:8px 0">${c} / ${tot}</div>
  <div style="font-size:18px;font-weight:700;color:${color(p/100)}">正确率 ${p}%</div>
  <div class="bar" style="margin-top:14px"><i style="width:${p}%;background:${color(p/100)}"></i></div>
  <div style="margin-top:12px">${plist||'<span class="pill green">本轮全对 🎉</span>'}</div></div>`;
 h+=`<div class="card"><div class="grid">
  <button class="btn" onclick="start(round.mode,round.arg)"><span class="b1">🔁 同模式再刷</span><span class="b2">重新组卷，顺序不同</span></button>
  <button class="btn" onclick="start('wrong')"><span class="b1">❌ 只刷错题</span><span class="b2">${S.wrong.length} 题</span></button>
  <button class="btn" onclick="start('weak')"><span class="b1">🎯 薄弱考点重测</span><span class="b2">按正确率最低的考点</span></button>
  <button class="btn" onclick="go('stats')"><span class="b1">📊 看薄弱点</span><span class="b2">按考点/按节统计</span></button>
 </div><button class="btn ghost" style="margin-top:10px" onclick="go('home')">回首页</button></div>`;
 $('#v-result').innerHTML=h;setTab('home');show('result');
}

/* ---------- 薄弱点 ---------- */
let statsMode='chapter';
function renderStats(){
 const t=totalR(),d=t.r+t.w,r=d?Math.round(t.r/d*100):0;
 const arr=(statsMode==='point'?weakPoints():statsMode==='section'?weakSections():weakChapters()).sort((a,b)=>{
   if(a.rate===null&&b.rate===null)return 0;if(a.rate===null)return 1;if(b.rate===null)return -1;return a.rate-b.rate});
 let h=`<div class="card"><h3>总体掌握情况</h3><div class="statline">
  <div><div class="n">${d}</div><div class="l">累计作答</div></div>
  <div><div class="n">${r}%</div><div class="l">总正确率</div></div>
  <div><div class="n">${S.wrong.length}</div><div class="l">在册错题</div></div></div>
  <div class="row" style="margin-top:12px"><button class="btn small" onclick="statsMode='chapter';renderStats()" ${statsMode==='chapter'?'style="background:#e8f2f1"':''}>按章</button><button class="btn small" onclick="statsMode='section';renderStats()" ${statsMode==='section'?'style="background:#e8f2f1"':''}>按节</button><button class="btn small" onclick="statsMode='point';renderStats()" ${statsMode==='point'?'style="background:#e8f2f1"':''}>按考点</button></div>
  <div class="muted" style="margin-top:8px">按正确率从低到高排，红色（＜60%）优先重刷。</div></div>`;
 h+=`<div class="card"><h3>${statsMode==='point'?'考点':statsMode==='section'?'节':'章'}正确率</h3>`;
 arr.forEach(p=>{const pc=p.rate===null?0:Math.round(p.rate*100);
  const src=Q.filter(q=>statsMode==='point'?q.pkey===p.key:statsMode==='section'?q.sec===p.name:q.chapter===p.name);
  const c1=src.filter(q=>q.type==='单选').length,c2=src.filter(q=>q.type==='多选').length,c3=src.filter(q=>q.type==='判断').length;
  const mode=statsMode==='point'?'point':statsMode==='section'?'section':'chapter';
  const arg=statsMode==='point'?p.key:p.name;
  const chap=statsMode==='point'?esc(p.chap.split(' ')[0])+' · ':'';
  h+=`<div class="item"><div class="hd"><div><div class="nm">${chap}${esc(p.name)} ${tag(p.rate)}</div>
   <div class="st">作答 ${p.done} 次 · 对 ${p.r} / 错 ${p.w}${p.rate===null?' · 尚未练习':' · 正确率 '+pc+'%'}</div>
   <div class="st">本题库 ${src.length} 题：单选 ${c1} · 多选 ${c2} · 判断 ${c3}（同点多面）</div></div>
   <button class="btn small" style="white-space:nowrap" onclick="start('${mode}','${esc(arg)}')">练这个</button></div>
   <div class="wk"><i style="width:${pc}%;background:${color(p.rate)}"></i></div></div>`});
 h+=`</div><button class="btn primary" onclick="start('weak')"><span class="b1">🎯 一键生成薄弱考点专测</span><span class="b2">取正确率最低的 5 个考点组卷</span></button>`;
 $('#v-stats').innerHTML=h;
}

/* ---------- 错题本 ---------- */
function renderWrong(){
 const list=Q.filter(q=>S.wrong.includes(q.id));
 let h=`<div class="card"><h3>错题本（${list.length}）</h3><div class="muted">答对一次即自动移出；做错会重新收进来。历史错误仍计入薄弱点统计。</div>
  <div class="row" style="margin-top:12px"><button class="btn small" onclick="start('wrong')">❌ 只刷这些题</button><button class="btn small" onclick="clearWrong()">清空错题本</button></div></div>`;
 if(!list.length)h+=`<div class="card muted" style="text-align:center;padding:30px">当前没有错题，保持住 🎉</div>`;
 list.forEach(q=>{const s=stat(q);
  h+=`<div class="item"><div class="qtag">${esc(q.chapter)} · ${esc(q.sec)} · ${esc(q.type)} · ${esc(q.point)}</div>
   <div class="nm" style="font-size:15px">${esc(q.stem)}</div>
   <div class="st">累计 对${s.r} / 错${s.w}　<button class="btn small" style="margin-top:8px" onclick="removeWrong('${q.id}')">移出错题本</button></div></div>`});
 $('#v-wrong').innerHTML=h;
}
function removeWrong(id){S.wrong=S.wrong.filter(x=>x!==id);save();renderWrong();toast('已移出')}
function clearWrong(){if(!confirm('清空错题本？（不影响正确率统计）'))return;S.wrong=[];save();renderWrong();toast('已清空')}

/* ---------- 进度导出 / 导入 / 重置 ---------- */
function exportP(){const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='CPA会计_刷题进度.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('进度已导出')}
$('#fileIn').addEventListener('change',function(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.stats||typeof o.stats!=='object')throw 0;
  S=migrate(o);save();go('home');toast('进度已导入 ✅')}
  catch(err){toast('文件格式不对，请选择本页导出的 JSON')}};rd.readAsText(f);e.target.value=''});
function resetP(){if(!confirm('重置全部刷题进度？（含正确率、错题本，且不可撤销）'))return;
 S=JSON.parse(JSON.stringify(DEF));save();go('home');toast('已重置')}
function calibrateSessions(){
 const v=prompt('把「已完成轮数」校准为多少？\\n（每轮至少作答 1 题才算一轮；旧版曾把只点进去没做题也计入）',String(S.sessions));
 if(v===null)return;
 const n=parseInt(v,10);
 if(isNaN(n)||n<0||n>99999){toast('请输入 0 或正整数');return}
 S.sessions=n;save();renderHome();toast('轮数已校准为 '+n);
}

renderHome();
</script>
